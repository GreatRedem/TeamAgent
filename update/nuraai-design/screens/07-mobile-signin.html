<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NuraAI mobile — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Archivo,'Helvetica Neue',sans-serif;background:#0B0D0F;color:#EBEEEF}
a{color:#3FCBB0}a:hover{color:#6FDCC6}
</style>
<style>
body{display:flex;justify-content:center;align-items:flex-start;padding:24px;background:#0B0D0F}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:72px 20px 34px;background:#0B0D0F;background-image:linear-gradient(#12171A 1px,transparent 1px),linear-gradient(90deg,#12171A 1px,transparent 1px);background-size:52px 52px;">

  <div style="display:flex;flex-direction:column;gap:22px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:9px;background:#3FCBB0;display:flex;align-items:center;justify-content:center;">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#06231D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5V3.5l9 9v-9"></path></svg>
      </div>
      <span style="font-size:17px;font-weight:600;letter-spacing:-0.01em;">NuraAI</span>
    </div>
    <h1 style="margin:0;font-size:38px;line-height:1.05;letter-spacing:-0.03em;font-weight:600;text-wrap:pretty;">Sign in with your wallet.</h1>
    <p style="margin:0;font-size:15px;line-height:1.6;color:#AAB3B8;">One signature. The server writes the challenge and spends it the moment you use it.</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px;">
    <div style="background:#121518;border:1px solid #262D33;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7E888E;">CHALLENGE</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#D9A441;border:1px solid #4A3A1B;background:#1C1710;border-radius:999px;padding:4px 9px;">EXPIRES IN 4:12</span>
      </div>
      <div style="display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;">
        <span style="color:#7E888E;">address</span><span style="color:#EBEEEF;">0x9f4b…4C2a</span>
        <span style="color:#7E888E;">nonce</span><span style="color:#3FCBB0;">7c1f9a4e2b83d015</span>
        <span style="color:#7E888E;">expires</span><span style="color:#AAB3B8;">14:07:11Z</span>
      </div>
      <div style="display:flex;gap:14px;">
        <div style="display:flex;align-items:center;gap:7px;">
          <span style="width:5px;height:5px;border-radius:50%;background:#3FCBB0;"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#AAB3B8;">SINGLE USE</span>
        </div>
        <div style="display:flex;align-items:center;gap:7px;">
          <span style="width:5px;height:5px;border-radius:50%;background:#3FCBB0;"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#AAB3B8;">NO PASSWORD</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <a href="08-mobile-overview.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#3FCBB0;color:#06231D;font-size:16px;font-weight:600;text-decoration:none;">Sign with wallet</a>
      <button type="button" style="height:52px;border-radius:12px;background:transparent;border:1px solid #323A41;color:#EBEEEF;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;">WalletConnect</button>
    </div>

    <p style="margin:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;color:#7E888E;">SIGNATURE ONLY — NO TRANSACTION, NO GAS.</p>
  </div>

</div>
</body>
</html>
