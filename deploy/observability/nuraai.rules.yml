# NuraAI alert rules (docs/22-observability.md alert tiers).
#
# Metric names are the real registry names from
# apps/api/src/observability/metrics.ts — notably `tool_calls_denied_total`
# (not `tool_calls_total{decision="denied"}`). Labels are bounded enums only;
# never team_id/agent_id/user_id/run_id (docs/22 cardinality rule).
#
# Every rule carries for:, a severity: label, summary:/description:
# annotations, and a runbook_url: pointing at the matching docs/26-runbook.md
# section. Operating Prometheus/Alertmanager and receivers remains host work;
# these rules ship as deploy artifacts.

groups:
  - name: nuraai-page
    rules:
      - alert: NuraaiRefreshTokenReuse
        expr: increase(refresh_token_reuse_total[5m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Refresh token reuse detected (possible token theft)
          description: refresh_token_reuse_total increased in the last 5m. Should be exactly zero in healthy operation (W6).
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiCrossTeamAccessDenied
        expr: increase(cross_team_access_denied_total[5m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Tenant isolation rejection (possible breach or probe)
          description: cross_team_access_denied_total increased in the last 5m. Should be zero; anything else is a bug or a probe.
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiApiHighErrorRate
        expr: sum(rate(http_requests_total{status_class="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: API 5xx rate above threshold
          description: 5xx share of http_requests_total exceeds 5% for 5m. Read the unhandled-error log lines first (error_name, error_code).
          runbook_url: docs/26-runbook.md#availability-and-performance-pages

      - alert: NuraaiQueueDepthGrowing
        expr: sum(queue_depth{status="queued"}) > 100
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Queued job backlog above threshold
          description: sum(queue_depth{status="queued"}) above 100 for 10m. Enqueue rate exceeds drain rate; compare jobs_total outcomes per queue.
          runbook_url: docs/26-runbook.md#availability-and-performance-pages

      - alert: NuraaiJobsDead
        expr: sum(increase(jobs_dead_total[10m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Jobs exhausting max_attempts
          description: jobs_dead_total increased in the last 10m. Read last_error on the dead rows for the handler bug or bad payload.
          runbook_url: docs/26-runbook.md#availability-and-performance-pages

      - alert: NuraaiModelErrorRate
        expr: sum(rate(model_calls_total{status="error"}[5m])) / sum(rate(model_calls_total[5m])) > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Model provider error rate above threshold
          description: Error share of model_calls_total exceeds 10% for 5m. Check MODEL_TIMEOUT vs MODEL_PROTOCOL_ERROR; runs fail closed.
          runbook_url: docs/26-runbook.md#dependency-pages

  - name: nuraai-ticket
    rules:
      - alert: NuraaiToolCallsDenied
        expr: sum(rate(tool_calls_denied_total[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Elevated tool-call denials
          description: tool_calls_denied_total rate above 0.1/sec for 10m. Denials alone from one agent trace pattern match context injection (T4).
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiDestinationDenied
        expr: increase(destination_denied_total[10m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Egress allowlist rejections
          description: destination_denied_total increased in the last 10m. Usually a new destination without an allowlist entry; escalate on repetition from one agent.
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiAuthDomainMismatch
        expr: sum(rate(auth_failures_total{reason="domain_mismatch"}[5m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Elevated SIWE domain-mismatch failures (possible phishing)
          description: auth_failures_total{reason="domain_mismatch"} rate above 0.05/sec for 10m. Capture IPs, publish the blocklist, verify SIWE_DOMAIN.
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiEip1271Failures
        expr: sum(rate(eip1271_failures_total[5m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Elevated EIP-1271 verification failures
          description: eip1271_failures_total rate above 0.05/sec for 10m. Check EVM_RPC_URL latency first; RPC degradation fails closed.
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiApprovalRequestsElevated
        expr: sum(increase(approval_requests_total{context_trust_level="untrusted"}[30m])) > 10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Untrusted approval requests accumulating
          description: approval_requests_total{context_trust_level="untrusted"} above 10 in 30m. The counter cannot show aging; check the approvals queue for requests near expiry without a decision.
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages

      - alert: NuraaiApiKeyTrustCeilingRaised
        expr: increase(apikey_trust_ceiling_raised_total[10m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: API key issued or used at the user_input trust ceiling
          description: apikey_trust_ceiling_raised_total increased in the last 10m. Review which agents accept untrusted ingress (T16).
          runbook_url: docs/26-runbook.md#should-be-zero-security-pages
