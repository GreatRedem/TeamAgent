server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid;
    include /etc/nginx/snippets/nuraai-security-headers.conf;

    if ($host != example.invalid) {
        return 444;
    }
    if ($http_host !~* "^example[.]invalid(:80)?$") {
        return 444;
    }

    location ~ ^/(health|metrics)(/|$) {
        return 404;
    }

    location / {
        return 308 https://example.invalid$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/nginx/tls/REPLACE_WITH_FULLCHAIN.pem;
    ssl_certificate_key /etc/nginx/tls/REPLACE_WITH_PRIVATE_KEY.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    root /opt/nuraai/current/apps/web/dist;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 2m;
    include /etc/nginx/snippets/nuraai-security-headers.conf;

    if ($host != example.invalid) {
        return 444;
    }
    if ($http_host !~* "^example[.]invalid(:443)?$") {
        return 444;
    }

    location ~ ^/(health|metrics)(/|$) {
        return 404;
    }

    location ~ ^/(auth|teams|users)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host example.invalid;
        proxy_set_header X-Forwarded-Host example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api(/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location = /assets {
        return 404;
    }

    location ~ ^/assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/nuraai-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        include /etc/nginx/snippets/nuraai-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|txt|webmanifest|html)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/nuraai-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/nuraai-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
